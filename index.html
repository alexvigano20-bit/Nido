<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F1F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14111A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nido">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}#app{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Nido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app — scrolling content area above a fixed tab bar; chat owns its own full-height column. */
:root{
  --bg:#F3F1F7; --surface:#FFFFFF; --surface-2:#EBE7F1; --ink:#1E1928; --muted:#6A6377; --line:#DCD6E5;
  --accent:#B3305B; --accent-ink:#FFFFFF; --accent-soft:#F5DCE5;
  --me-bg:#B3305B; --me-fg:#FFFFFF; --them-bg:#FFFFFF; --them-fg:#1E1928;
  --teal:#1F6F6A; --teal-soft:#D6EEEB; --amber:#9A6412; --amber-soft:#F7E8CF;
  --ok:#2C7A4B; --ok-soft:#DAF0E2; --danger:#B42318; --danger-soft:#FBE1DE;
  --shadow:0 10px 30px rgba(40,20,60,.14);
  --scrim:rgba(20,14,28,.45);
  --display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14111A; --surface:#1E1A26; --surface-2:#292332; --ink:#EEE9F5; --muted:#A39BB1; --line:#342D3F;
  --accent:#E3678F; --accent-ink:#1A0E14; --accent-soft:#3B2130;
  --me-bg:#8C2A4D; --me-fg:#FFF1F6; --them-bg:#262030; --them-fg:#EEE9F5;
  --teal:#5CC2B9; --teal-soft:#173532; --amber:#E2AE5C; --amber-soft:#3A2C16;
  --ok:#69C98F; --ok-soft:#173424; --danger:#F07A6C; --danger-soft:#3D1D1A;
  --shadow:0 10px 30px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14111A; --surface:#1E1A26; --surface-2:#292332; --ink:#EEE9F5; --muted:#A39BB1; --line:#342D3F;
  --accent:#E3678F; --accent-ink:#1A0E14; --accent-soft:#3B2130;
  --me-bg:#8C2A4D; --me-fg:#FFF1F6; --them-bg:#262030; --them-fg:#EEE9F5;
  --teal:#5CC2B9; --teal-soft:#173532; --amber:#E2AE5C; --amber-soft:#3A2C16;
  --ok:#69C98F; --ok-soft:#173424; --danger:#F07A6C; --danger-soft:#3D1D1A;
  --shadow:0 10px 30px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); color-scheme:dark}

html,body{height:100%}
html{-webkit-text-size-adjust:100%}
.input,select.input,textarea.input,.composer textarea,input,textarea,select{font-size:16px}
button,a,[role=button]{touch-action:manipulation}
#app{height:var(--app-h,100%)}
body.kb #tabbar{display:none}
body.veil #app,body.veil .viewer,body.veil .scrim,body.veil .call{filter:blur(22px)}
.bub a{color:inherit;text-decoration:underline;overflow-wrap:anywhere}
.lock{position:fixed;inset:0;z-index:95;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lock .box{width:100%;max-width:320px;display:flex;flex-direction:column;gap:16px;text-align:center}
.lock input{text-align:center;letter-spacing:.5em;font-size:24px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
.serif{font-family:var(--display)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}

#app{display:flex;flex-direction:column}
#main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 24px;-webkit-overflow-scrolling:touch}
.view.chat{padding:0;overflow:hidden;display:flex;flex-direction:column}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* Tab bar */
#tabbar{display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600;position:relative;border-radius:12px}
#tabbar button svg{width:22px;height:22px}
#tabbar button[aria-current="page"]{color:var(--accent)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px;font-weight:700}

/* Page heads */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:4px}
.phead h1{font-family:var(--display);font-size:34px;line-height:1}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h2{font-size:15px;font-family:var(--body);font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}

.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:0}

.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:44px}
textarea.input{resize:none}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.check{display:flex;align-items:center;gap:10px;padding:10px 0}
.check input{width:20px;height:20px;accent-color:var(--accent)}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);border:0;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.no{background:var(--danger-soft);color:var(--danger)}
.chip.off{background:var(--amber-soft);color:var(--amber)}
.chip.on{background:var(--teal-soft);color:var(--teal)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--ok)}

/* Home */
.hero{display:flex;flex-direction:column;gap:6px;padding:4px 0 2px}
.hero .hi{font-family:var(--display);font-size:40px;line-height:1.02}
.hero .hi em{color:var(--accent)}
.partner{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-size:22px;flex:none;position:relative}
.avatar .dot{position:absolute;right:0;bottom:0;border:2px solid var(--surface);width:12px;height:12px}
.bignum{font-family:var(--display);font-size:44px;line-height:1}
.countdown{background:var(--accent);color:var(--accent-ink);border:0}
.countdown .muted{color:inherit;opacity:.8}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .when{width:52px;flex:none;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;padding-top:1px}
.item .what{flex:1;min-width:0}
.item .what b{font-weight:600;display:block;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* Chat */
.chathead{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.chathead .who{flex:1;min-width:0}
.chathead .who b{display:block;font-size:16px}
.status{font-size:12.5px;color:var(--muted);min-height:18px}
.status.live{color:var(--ok);font-weight:600}
.msgs{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 12px 8px;display:flex;flex-direction:column;gap:4px;overscroll-behavior:contain}
.notice{align-self:center;text-align:center;font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:6px 10px;max-width:320px;margin:4px 0 10px}
.daysep{align-self:center;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;margin:10px 0 6px}
.bub{max-width:80%;padding:8px 12px 6px;border-radius:18px;position:relative;overflow-wrap:anywhere;white-space:pre-wrap}
.bub{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.bub .swipe-ic{position:absolute;left:-38px;top:50%;width:28px;height:28px;margin-top:-14px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;opacity:0;pointer-events:none}
.bub .swipe-ic svg{width:16px;height:16px}
.bub.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.quote{display:block;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:8px;padding:5px 8px;margin:0 0 6px;font-size:13px;line-height:1.3;cursor:pointer;white-space:normal;max-width:100%;overflow:hidden}
.bub.me .quote{background:rgba(255,255,255,.18);border-left-color:var(--me-fg)}
.quote b{display:block;font-size:12px;font-weight:700}
.quote span{display:block;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub.media .quote{margin-bottom:0}
.bub.media.withq{flex-direction:column;align-items:stretch}
.bub.media .mrow{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
#reply-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border-top:1px solid var(--line)}
#reply-bar .quote{flex:1;min-width:0;margin:0}
.bub.me{align-self:flex-end;background:var(--me-bg);color:var(--me-fg);border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--them-bg);color:var(--them-fg);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub .meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;opacity:.75;margin-top:2px;white-space:nowrap}
.bub .meta svg{width:15px;height:15px}
.bub.media{display:flex;align-items:center;gap:10px;white-space:normal;cursor:pointer;min-width:200px;border:0;font:inherit;text-align:left}
.bub.media.them{border:1px solid var(--line)}
.bub.media .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.18);flex:none}
.bub.them.media .ic{background:var(--accent-soft);color:var(--accent)}
.bub.media .ic svg{width:20px;height:20px}
.bub.media .tx{flex:1;min-width:0}
.bub.media .tx b{display:block;font-weight:600}
.bub.media .tx span{font-size:12px;opacity:.8}
.bub.spent{opacity:.6;cursor:default}
.bub.sealed{cursor:default}
#typing-slot{display:flex;flex-direction:column}
.typing{align-self:flex-start;background:var(--them-bg);border:1px solid var(--line);border-radius:18px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 10px;background:var(--surface);border-top:1px solid var(--line)}
.composer textarea{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:10px 14px;max-height:120px;min-height:42px;resize:none;line-height:1.35}
.round{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink)}
.round.send{background:var(--accent);color:var(--accent-ink)}
.round svg{width:20px;height:20px}

/* Calendar */
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calnav h2{font-family:var(--display);font-size:26px;font-weight:400}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.cal button{aspect-ratio:1/1;max-width:100%;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;font-weight:500;padding:0}
.cal button.out{color:var(--muted);opacity:.45}
.cal button.today{color:var(--accent);font-weight:800}
.cal button.sel{background:var(--accent);color:var(--accent-ink)}
.cal .dots{display:flex;gap:2px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal button.sel .dots i{background:var(--accent-ink)}
.kind-incontro{--k:var(--accent)} .kind-esame{--k:var(--amber)} .kind-evento{--k:var(--teal)} .kind-ricorrenza{--k:var(--ok)}
.ev{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.ev:first-child{border-top:0}
.ev .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--k,var(--teal));flex:none}
.ev .t{width:48px;flex:none;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.ev .b{flex:1;min-width:0}
.ev .b b{font-weight:600;display:block;overflow-wrap:anywhere}

/* Lessons */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px;font-variant-numeric:tabular-nums}
.week button span{font-size:10.5px;text-transform:uppercase;color:var(--muted);font-weight:700}
.week button b{font-size:16px}
.week button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.week button.sel span{color:inherit;opacity:.75}
.week button.today b{color:var(--accent)}
.week button.sel.today b{color:inherit}
.week button i{width:5px;height:5px;border-radius:50%;background:var(--teal)}
.week button i.none{background:transparent}
.lesson{display:flex;gap:12px;align-items:stretch;padding:12px 0;border-top:1px solid var(--line)}
.lesson:first-child{border-top:0}
.lesson .sw{width:6px;border-radius:3px;flex:none}
.lesson .time{width:50px;flex:none;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;line-height:1.3}
.lesson .info{flex:1;min-width:0}
.lesson .info b{display:block;font-weight:600}
.lesson .info .chip{margin-top:6px}
.att{display:flex;align-items:center;gap:10px}
.meter{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal);border-radius:4px}

/* Todos */
.todo{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:none;display:grid;place-items:center;padding:0;color:var(--accent-ink)}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick svg{width:15px;height:15px}
.todo .tt{flex:1;min-width:0}
.todo .tt b{font-weight:500;display:block;overflow-wrap:anywhere}
.todo.done .tt b{text-decoration:line-through;color:var(--muted)}
.todo .more{background:none;border:0;color:var(--muted);padding:2px 4px}
.addrow{display:flex;gap:8px}
.addrow .input{flex:1}
details.hist summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.hist summary::-webkit-details-marker{display:none}

/* Sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h3{font-family:var(--display);font-size:26px}
.sheet .actions{display:flex;gap:10px}
.sheet .actions .btn{flex:1}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:0;background:var(--surface);text-align:left;font-weight:600}
.menu button svg{width:22px;height:22px;color:var(--accent);flex:none}
.menu button span{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.menu label{cursor:pointer}

/* Viewer */
.viewer{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.viewer .vbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.viewer .vbar button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:12px;padding:9px 14px;font-weight:600}
.viewer .vbody{flex:1;min-height:0;display:grid;place-items:center;padding:8px}
.viewer canvas,.viewer video{max-width:100%;max-height:100%;border-radius:8px}
.viewer audio{width:min(420px,90vw)}
.viewer .vbody{position:relative;overflow:hidden}
.viewer .vbody canvas{touch-action:none;transform-origin:0 0;will-change:transform}
.viewer.covered .vbody>*{visibility:hidden}
.cam{position:fixed;inset:0;z-index:70;background:#000;color:#fff;display:flex;flex-direction:column}
.cam video{flex:1;min-height:0;width:100%;object-fit:cover}
.cam video.mirror{transform:scaleX(-1)}
.cam .ctop,.cam .cbot{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.cam .ctop{top:0;padding-top:calc(12px + env(safe-area-inset-top,0px))}

/* ======================= Crypto (end-to-end) ======================= */

let KEY = null;
async function deriveKey(pass, saltB64) {
  const base = await crypto.subtle.importKey('raw', TE.encode(pass.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(saltB64), iterations: 310000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, u8));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
}
async function decBytes(u8, key = KEY) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8.subarray(0, 12) }, key, u8.subarray(12)));

function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('nido', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('k');

  });

      const tx = d.transaction('k', op === 'get' ? 'readonly' : 'readwrite'); const s = tx.objectStore('k');
      const rq = op === 'get' ? s.get('key') : op === 'put' ? s.put(val, 'key') : s.delete('key');
      rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
    });
  } catch { return null; }

const memo = new WeakMap();

}

function makeDb() {
  const docs = new Map(); const listeners = new Set();
  const freeze = o => { if (o && typeof o === 'object') { Object.values(o).forEach(freeze); Object.freeze(o); } return o; };
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const put = (path, data) => { const old = docs.get(path); if (old && same(old, data)) return false; docs.set(path, freeze(structuredClone(data))); return true; };
  const emit = () => listeners.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  const parentOf = p => p.split('/').slice(0, -1).join('/');
  const snapDoc = path => { const b = docs.get(path); return { id: path.split('/').pop(), exists: b !== undefined, data: () => b, metadata: { fromCache: false, hasPendingWrites: false } }; };
  let ready, readyResolve; ready = new Promise(r => readyResolve = r);
  async function loadAll() {
    const fresh = new Map(); const page = 1000;
    for (let from = 0; ; from += page) {
      const { data, error } = await sb.from('docs').select('path,data').range(from, from + page - 1);
      if (error) throw dbErr(error);
      data.forEach(r => fresh.set(r.path, r.data));
      if (data.length < page) break;
    }
    for (const p of [...docs.keys()]) if (!fresh.has(p)) docs.delete(p);
    fresh.forEach((d, p) => put(p, d));
    readyResolve(); emit();
  }
  const channel = sb.channel('nido-docs')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, pl => {
      if (pl.eventType === 'DELETE') { if (pl.old?.path && docs.delete(pl.old.path)) emit(); }
      else if (pl.new?.path && put(pl.new.path, pl.new.data)) emit();
    })
    .subscribe(st => { if (st === 'SUBSCRIBED') loadAll().catch(e => console.error('load', e)); });

  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadAll().catch(() => {}); });
  setTimeout(() => loadAll().catch(e => console.error('load', e)), 4000);

  function docRef(path) {
    return {
      id: path.split('/').pop(), path,
      async get() { await ready; return snapDoc(path); },
      async set(data) {
        const { error } = await sb.from('docs').upsert({ path, coll: parentOf(path), data, updated_at: new Date().toISOString() });
        if (error) throw dbErr(error); if (put(path, data)) emit();
      },
      async update(patch) {
        await ready; const cur = docs.get(path);
        if (!cur) { const x = new Error('missing'); x.code = 'invalid_argument'; throw x; }
        const merge = (a, b) => { const o = { ...a }; for (const [k, v] of Object.entries(b)) o[k] = v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' ? merge(a[k], v) : v; return o; };

      async delete() {

      onSnapshot(next) {
        let last = Symbol(); const f = () => { const s = snapDoc(path); if (s.data() !== last) { last = s.data(); next(s); } };
        listeners.add(f); ready.then(f); return () => listeners.delete(f);
      },
    };
  }
  function collRef(path, q = { order: null, limit: 1000 }) {
    const depth = path.split('/').length + 1;
    const run = () => {
      let list = [...docs.keys()].filter(p => p.startsWith(path + '/') && p.split('/').length === depth).map(snapDoc);
      if (q.order) { const [f, dir] = q.order; list.sort((a, b) => { const x = a.data()[f], y = b.data()[f]; return (x < y ? -1 : x > y ? 1 : 0) * (dir === 'desc' ? -1 : 1); }); }

      return { docs: list, size: list.length, empty: !list.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
    };
    return {
      path,
      orderBy: (f, d = 'asc') => collRef(path, { ...q, order: [f, d] }),
      limit: n => collRef(path, { ...q, limit: n }),
      async get() { await ready; return run(); },
      onSnapshot(next) {
        let lastIds = null;
        const f = () => { const s = run(); const ids = s.docs.map(d => d.data()); if (!lastIds || ids.length !== lastIds.length || ids.some((x, i) => x !== lastIds[i])) { lastIds = ids; next(s); } };
        listeners.add(f); ready.then(f); return () => listeners.delete(f);
      },
      doc: id => docRef(path + '/' + id),
    };
  }
  return { doc: docRef, collection: collRef, channel };
}
function makeRoom() {
  let peerHandlers = new Set(), mine = {}, joined = false;
  const ch = sb.channel('nido-presence', { config: { presence: { key: S.me } } });
  const peers = () => Object.entries(ch.presenceState()).flatMap(([by, arr]) => arr.map(p => ({ by, isMe: by === S.me, kind: 'viewer', presence: p })));

async function boot() {
  if (!window.supabase?.createClient) return gate('nodb');
  sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return gate('auth');
  S.me = session.user.id; S.email = session.user.email;
  const { data: ok, error } = await sb.rpc('join_nido');
  if (error) { console.error(error); return gate('nodb'); }
  if (!ok) return gate('full');
  db = makeDb();
  room = makeRoom();
  let first = true;
  db.doc('meta/couple').onSnapshot(async snap => {
    S.couple = snap.exists ? snap.data() : null;
    if (first) { first = false; await route(); }
    else if (KEY) { renderAll(); }
  });
}
async function signOut() { await keyStore('del'); KEY = null; try { await sb.auth.signOut(); } catch {} location.reload(); }

async function route() {
  if (!S.couple) return gate('create');
  const members = S.couple.members || [];
  if (!members.includes(S.me)) return members.length >= 2 ? gate('full') : gate('join');
  const k = await keyStore('get');
  if (k) {
    try { await decJSON(S.couple.check, k); KEY = k; return startApp(); } catch { await keyStore('del'); }
  }
  gate('unlock');
}

/* ---------- Unlock code (optional): asked when opening and after 1 minute away ---------- */
let hiddenAt = 0, lockOpen = false;
const pinInfo = () => { try { return JSON.parse(lsGet('pin') || 'null'); } catch { return null; } };
async function pinHash(pin, salt) {
  const k = await crypto.subtle.importKey('raw', TE.encode(pin), 'PBKDF2', false, ['deriveBits']);
  return b64(new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64d(salt), iterations: 150000, hash: 'SHA-256' }, k, 256)));
}
function showLock() {
  const info = pinInfo(); if (!info || lockOpen) return;
  lockOpen = true; closeViewer();
  const el = document.createElement('div'); el.className = 'lock'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Nido bloccato');
  el.innerHTML = `<form class="box" id="lk-f"><div class="mark serif" style="font-size:48px;color:var(--accent)">Nido</div><p class="muted" style="margin:0">Inserisci il codice di sblocco</p>
    <input class="input" id="lk-in" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="8" aria-label="Codice">
    <button class="btn">Sblocca</button><p class="small" id="lk-err" style="color:var(--danger);min-height:18px"></p>
    <button type="button" class="link small" id="lk-forgot">Ho dimenticato il codice</button></form>`;
  document.body.appendChild(el);
  setTimeout(() => $('#lk-in', el).focus(), 50);
  $('#lk-forgot', el).onclick = async () => { lsSet('pin', null); lsSet('pinFails', null); await keyStore('del'); location.reload(); };
  $('#lk-f', el).onsubmit = async e => {
    e.preventDefault();
    const v = $('#lk-in', el).value;
    if (await pinHash(v, info.salt) === info.hash) { lsSet('pinFails', null); el.remove(); lockOpen = false; return; }
    const fails = +(lsGet('pinFails') || 0) + 1; lsSet('pinFails', String(fails));
    if (fails >= 8) { lsSet('pin', null); lsSet('pinFails', null); await keyStore('del'); location.reload(); return; }
    $('#lk-err', el).textContent = `Codice errato. Ancora ${8 - fails} tentativi, poi servirà la frase segreta.`;
    $('#lk-in', el).value = ''; const f = $('#lk-f', el); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
  };
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (started && hiddenAt && Date.now() - hiddenAt > 60_000) showLock();
});
function pinSheet() {
  const has = !!pinInfo();
  sheet('Codice di sblocco', `<p class="muted small" style="margin:0">Un codice di 4–8 cifre chiesto quando apri il Nido e quando ci torni dopo più di un minuto. Vale solo su questo telefono.</p>
    ${has ? '<button class="btn danger block" id="pn-off">Togli il codice</button>' : ''}
    <label class="field"><span>${has ? 'Nuovo codice' : 'Codice'}</span><input class="input" id="pn-1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off"></label>
    <label class="field"><span>Ripeti il codice</span><input class="input" id="pn-2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off"></label>
    <div class="actions"><button class="btn ghost" data-close>Annulla</button><button class="btn" id="pn-go">Salva</button></div>`, sh => {
    const off = $('#pn-off', sh); if (off) off.onclick = () => { lsSet('pin', null); closeSheet(); toast('Codice tolto'); };
    $('#pn-go', sh).onclick = async () => {
      const a = $('#pn-1', sh).value, b = $('#pn-2', sh).value;
      if (!/^\d{4,8}$/.test(a)) return toast('Il codice deve avere da 4 a 8 cifre.');
      if (a !== b) return toast('I due codici non coincidono.');
      const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
      lsSet('pin', JSON.stringify({ salt, hash: await pinHash(a, salt) })); lsSet('pinFails', null);
      closeSheet(); toast('Codice impostato');
    };
  });
}

let popGuard = 0;
function pushNav(kind) { try { history.pushState({ nido: kind }, ''); } catch {} }
function popNav(kind) { if (history.state?.nido === kind) { popGuard++; history.back(); } }
let activeOverlay = null;
window.addEventListener('popstate', () => {
  if (popGuard) { popGuard--; return; }

function go(tab, fromPop) {

function subscribeAll() {
  db.doc('meta/settings').onSnapshot(async s => {
    const d = s.exists ? s.data() : {};

    try { S.secure = d.enc ? await decJSON(d.enc) : {}; } catch { S.secure = {}; }

  live(db.collection('presence'), l => { l.forEach(p => S.presence[p.id] = p.lastSeen); renderStatus(); renderHome(); });
  live(db.collection('msgs').orderBy('ts', 'desc').limit(800), l => {
    S.msgs = l.reverse(); renderBadge(); if (S.tab === 'chat') { renderChat(); markRead(); } else renderHome();

let myPresence = { on: !document.hidden, typing: false };

function startRoom() {
  if (startRoom.done || !room) return; startRoom.done = true;
  setPresence({ on: !document.hidden });
  room.onPeers(ch => {
    const pid = partnerId();
    const others = ch.peers.filter(p => !p.isMe && p.kind === 'viewer' && (p.by ? p.by === pid : true));
    const wasOnline = S.partnerOnline;
    S.partnerOnline = others.some(p => p.presence?.on);
    S.partnerTyping = others.some(p => p.presence?.on && p.presence?.typing);
    if (wasOnline && !S.partnerOnline) S.partnerLeftAt = Date.now();

    if (S.tab === 'chat') renderTyping();
  }, () => {});

function enableZoom(area, el) {

  });
  area.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const p = [...pts.values()];
    if (p.length >= 2 && start?.d) {
      const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      const ns = Math.min(5, Math.max(1, start.s * d / start.d));
      const cx = (p[0].x + p[1].x) / 2, cy = (p[0].y + p[1].y) / 2;

    }

}

async function saveSettings(plain, secure) {
  const next = { retention: plain.retention ?? S.settings.retention };
  const sec = secure ? { ...S.secure, ...secure } : S.secure;
  S.secure = sec; S.settings = { ...S.settings, ...next };
  await save('meta/settings', { ...next, enc: await encJSON(sec) });
}

let sheetEl = null;
function sheet(title, html, mount, opt = {}) {
  if (sheetEl) { sheetEl.remove(); sheetEl = null; } else pushNav('sheet');
  const sc = document.createElement('div'); sc.className = 'scrim';
  sc.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><span class="grab"></span><h3>${esc(title)}</h3>${html}</div>`;
  // The finger that opened a sheet (e.g. long-press) lifts right after: ignore that first tap so it can't close it or hit a button.
  const openedAt = Date.now();
  if (opt.guard) sc.addEventListener('click', e => { if (Date.now() - openedAt < 450) { e.stopPropagation(); e.preventDefault(); } }, true);
  if (!opt.lock) sc.addEventListener('click', e => { if (e.target === sc) closeSheet(); });
  $$('[data-close]', sc).forEach(b => b.onclick = () => closeSheet());
  document.body.appendChild(sc); sheetEl = sc;
  mount?.(sc);
  const first = $('input:not([type=checkbox]):not([type=date]):not([type=time]),textarea', sc);
  if (first && !first.value && matchMedia('(pointer:fine)').matches) first.focus();
}
function closeSheet() { if (!sheetEl) return; sheetEl.remove(); sheetEl = null; popNav('sheet'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (viewerCleanup) closeViewer(); else closeSheet(); } });

async function maybeTour() {
  if (+(lsGet('tourV') || 0) >= TOUR_VERSION) return;
  try { const p = await db.doc(`data/users/${S.me}/prefs`).get(); if (p.exists && +(p.data().tourV || 0) >= TOUR_VERSION) { lsSet('tourV', String(TOUR_VERSION)); return; } } catch {}

function runTour() {
  let i = 0;
  const el = document.createElement('div'); el.className = 'tour'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Tour guidato');
  el.innerHTML = `<div class="spot"></div><div class="tip"><span class="label" id="tr-n"></span><h3 id="tr-t"></h3><p id="tr-p"></p>
    <div class="row between"><div class="pips">${TOUR.map(() => '<i></i>').join('')}</div><div class="row"><button class="btn ghost" id="tr-skip">Salta</button><button class="btn" id="tr-next">Avanti</button></div></div></div>`;
  document.body.appendChild(el);
  const finish = async () => {
    el.remove(); lsSet('tourV', String(TOUR_VERSION)); go('home');
    try { await db.doc(`data/users/${S.me}/prefs`).set({ tourDone: true, tourV: TOUR_VERSION }); } catch {}
  };
  const show = () => {
    const st = TOUR[i]; if (S.tab !== st.tab) go(st.tab);
    $('#tr-n', el).textContent = `${i + 1} di ${TOUR.length}`; $('#tr-t', el).textContent = st.t; $('#tr-p', el).textContent = st.p;
    $$('.pips i', el).forEach((p, k) => p.classList.toggle('on', k === i));
    $('#tr-next', el).textContent = i === TOUR.length - 1 ? 'Iniziamo' : 'Avanti';
    const spot = $('.spot', el), tip = $('.tip', el);
    requestAnimationFrame(() => {
      const t = st.sel && $(st.sel);
      if (t) {
        const r = t.getBoundingClientRect(), p = 6;
        Object.assign(spot.style, { left: r.left - p + 'px', top: r.top - p + 'px', width: r.width + 2 * p + 'px', height: r.height + 2 * p + 'px', opacity: 1 });
        const below = r.top < innerHeight / 2;
        tip.style.top = below ? Math.min(innerHeight - 260, r.bottom + 16) + 'px' : 'auto';
        tip.style.bottom = below ? 'auto' : (innerHeight - r.top + 16) + 'px';
      } else {
        Object.assign(spot.style, { left: '50%', top: '50%', width: '0px', height: '0px' });
        tip.style.top = '30%'; tip.style.bottom = 'auto';
      }
    });
  };
  $('#tr-next', el).onclick = () => { if (++i >= TOUR.length) finish(); else show(); };
  $('#tr-skip', el).onclick = finish;
  show();
}

/* ---------- Delivery timing: tells the server when a message from the other person reached this app ---------- */
const deliveredSeen = new Set((() => { try { return JSON.parse(lsGet('dlv') || '[]'); } catch { return []; } })());
function reportDelivered() {
  if (!sb || !S.me) return;
  const cutoff = Date.now() - 86400000; let changed = false;
  for (const m of S.msgs) {
    if (m.from === S.me || m.ts < cutoff || deliveredSeen.has(m.id)) continue;
    deliveredSeen.add(m.id); changed = true;
    sb.rpc('msg_delivered', { p_path: 'msgs/' + m.id }).then(() => {}, () => {});
  }
  if (changed) lsSet('dlv', JSON.stringify([...deliveredSeen].slice(-300)));
}

/* ======================= Problem reports to Claude ======================= */
// Reports go to the `reports` table; a private GitHub check turns them into issues Claude reads when debugging.
// They never include messages or anything from the encrypted store, only what is typed here plus technical data.
const BUILD = '2026-10-07 06:07';
const recentErrors = (() => { try { return JSON.parse(lsGet('errs') || '[]'); } catch { return []; } })();
function deviceName() { const u = navigator.userAgent; return /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : 'Altro'; }
function noteError(where, e) {
  const msg = String(e?.message || e || '').slice(0, 300);
  const code = e?.code || '';
  if (!msg && !code) return;
  recentErrors.push({ at: new Date().toISOString(), where, code, msg });
  while (recentErrors.length > 20) recentErrors.shift();
  lsSet('errs', JSON.stringify(recentErrors));
  // Real bugs (not a weak connection) are reported automatically, at most 3 different ones per day.
  const network = code === 'unavailable' || /fetch|network|load failed|timeout|offline/i.test(msg);
  if (!network && sb && S.me) autoReport(where, msg);
}
window.addEventListener('error', e => noteError('js', e.error || e.message));
window.addEventListener('unhandledrejection', e => noteError('promise', e.reason));
async function autoReport(where, msg) {
  const day = today(); let log = {}; try { log = JSON.parse(lsGet('autoRep') || '{}'); } catch {}
  if (log.day !== day) log = { day, sent: [] };
  const key = (where + ':' + msg).slice(0, 120);
  if (log.sent.includes(key) || log.sent.length >= 3) return;
  log.sent.push(key); lsSet('autoRep', JSON.stringify(log));
  try { await sb.from('reports').insert({ kind: 'automatico', text: `Errore in ${where}: ${msg}`, diag: await diagnostics() }); } catch {}
}
async function diagnostics() {
  let swState = 'no', subOk = false;
  try { const reg = await navigator.serviceWorker?.getRegistration(); swState = reg?.active ? 'attivo' : 'assente'; subOk = !!(await reg?.pushManager?.getSubscription()); } catch {}
  return {
    versione: BUILD, dispositivo: deviceName(), browser: navigator.userAgent.slice(0, 180),
    installata_sulla_home: isStandalone(), schermo: `${innerWidth}x${innerHeight}`, online: navigator.onLine,
    notifiche: pushState(), iscrizione_push: subOk, service_worker: swState, sezione: S.tab,
    partner_online: S.partnerOnline, conteggi: { messaggi: S.msgs.length, eventi: S.events.length, cose_da_fare: S.todos.length, corsi: S.courses.length },
    ultimo_accesso_partner: S.presence[partnerId()] ? new Date(S.presence[partnerId()]).toISOString() : null,
    errori_recenti: recentErrors.slice(-10), codice_sblocco: !!pinInfo(), ora_locale: new Date().toString(),
  };
}
const AREAS = ['Chat', 'Foto e video', 'Notifiche', 'Calendario', 'Lezioni', 'Da fare', 'Accesso', 'Altro'];

  let mine = [];
  try { const r = await sb.from('reports').select('id,created_at,text,kind,forwarded_at').eq('kind', 'utente').order('created_at', { ascending: false }).limit(5); mine = r.data || []; } catch {}
  let area = 'Altro';
  sheet('Segnala un problema', `<p class="muted small" style="margin:0">Descrivi cosa non funziona: la segnalazione arriva a Claude, che la legge al prossimo controllo e la sistema. Non scrivere cose private: i vostri messaggi e contenuti non vengono mai allegati.</p>
    <div class="field"><span>Dove</span><div class="row" style="flex-wrap:wrap;gap:6px" id="rp-area">${AREAS.map(a => `<button type="button" class="chip" data-a="${a}" aria-pressed="${a === area}">${a}</button>`).join('')}</div></div>
    <label class="field"><span>Cosa è successo</span><textarea class="input" id="rp-t" rows="5" maxlength="2000" placeholder="Es. ho mandato una foto alle 21:10 ma a lei non è arrivata la notifica"></textarea></label>
    <label class="check"><input type="checkbox" id="rp-d" checked><span><b>Allega i dati tecnici</b><br><span class="small muted">Tipo di telefono, versione dell’app, stato delle notifiche, ultimi errori. Aiutano molto.</span></span></label>
    <div class="actions"><button class="btn ghost" data-close>Annulla</button><button class="btn" id="rp-go">Invia segnalazione</button></div>
    ${mine.length ? `<div class="stack"><span class="label">Le tue ultime segnalazioni</span>${mine.map(r => `<div class="small" style="display:flex;gap:8px;justify-content:space-between"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.text)}</span><span class="chip ${r.forwarded_at ? 'ok' : ''}">${r.forwarded_at ? 'Arrivata a Claude' : 'In attesa'}</span></div>`).join('')}</div>` : ''}`, sh => {
    const paint = () => $$('#rp-area [data-a]', sh).forEach(b => { const on = b.dataset.a === area; b.setAttribute('aria-pressed', on); b.className = 'chip' + (on ? ' acc' : ''); });
    paint();

    $('#rp-go', sh).onclick = async () => {
      const t = $('#rp-t', sh).value.trim();
      if (t.length < 5) return toast('Scrivi qualche parola su cosa non funziona.');
      $('#rp-go', sh).disabled = true;
      const diag = $('#rp-d', sh).checked ? await diagnostics() : { versione: BUILD, dispositivo: deviceName() };
      const { error } = await sb.from('reports').insert({ kind: 'utente', text: `[${area}] ${t}`, diag });
      if (error) { $('#rp-go', sh).disabled = false; console.error(error); return toast(/reports|relation|exist/i.test(error.message || '') ? 'Le segnalazioni non sono ancora attive: manca lo script SQL in Supabase.' : 'Non riesco a inviarla. Riprova tra poco.', 5000); }
      closeSheet(); toast('Segnalazione inviata. Grazie!');
    };
  });
}
